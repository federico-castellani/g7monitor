name: Release

# Publishes the phone and watch APKs, signed with the release key, as a GitHub Release.
# Start it by pushing a version tag (git tag v0.3.0 && git push origin v0.3.0) or from the
# Actions tab -> Release -> Run workflow. The app finds the new release by itself.
on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione da pubblicare (es. 0.3.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # GitHub environment: in Settings -> Environments -> release add yourself as required reviewer
    # and move the signing secrets there, so a release always waits for your approval.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Version
        id: version
        env:
          REQUESTED: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          V="${REQUESTED#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Versione non valida: '$V' (serve X.Y.Z, es. 0.3.0)"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.G7_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Manca il segreto G7_KEYSTORE_BASE64 (vedi README, 'Pubblicare una versione')"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest -PappVersion=${{ steps.version.outputs.version }}

      - name: Build signed APKs
        env:
          G7_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          G7_KEYSTORE_PASSWORD: ${{ secrets.G7_KEYSTORE_PASSWORD }}
          G7_KEY_ALIAS: ${{ secrets.G7_KEY_ALIAS }}
          V: ${{ steps.version.outputs.version }}
        run: |
          ./gradlew :app:assembleRelease :wear:assembleRelease -PappVersion=$V
          mkdir out
          # The app's updater looks for "G7Monitor-<version>.apk": keep these names.
          cp app/build/outputs/apk/release/app-release.apk "out/G7Monitor-$V.apk"
          cp wear/build/outputs/apk/release/wear-release.apk "out/G7Monitor-Wear-$V.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$V" out/*.apk --title "G7 Monitor $V" --generate-notes --target "$GITHUB_SHA"
